<VirtualHost *:80>
    ServerName www.lab08.nodosur.cl
    ServerAlias lab08.nodosur.cl
    DocumentRoot /var/www/html
    Redirect permanent / https://www.lab08.nodosur.cl/

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/lab08_error.log
    CustomLog ${APACHE_LOG_DIR}/lab08_access.log combined
</VirtualHost>
