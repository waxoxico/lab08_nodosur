<VirtualHost *:443>
    ServerName www.lab08.nodosur.cl
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/lab08.crt
    SSLCertificateKeyFile /etc/ssl/private/lab08.key

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/lab08_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lab08_ssl_access.log combined
</VirtualHost>
