# VM1 (proxy1): deja tambien sus propios logs en el arbol central.
# Sin "stop", de modo que sigue escribiendo en /var/log/syslog.
template(name="LocalPorMaquina" type="string"
  string="/var/log/nodosur/proxy1/%$YEAR%-%$MONTH%-%$DAY%.log")

if ($fromhost-ip == "127.0.0.1") then {
    action(type="omfile" dynaFile="LocalPorMaquina" fileCreateMode="0640" dirCreateMode="0750")
}
