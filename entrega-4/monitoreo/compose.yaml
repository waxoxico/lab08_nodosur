# Stack de monitoreo de Nodo Sur, en VM1 (proxy1)
# Destino: /srv/monitoring/compose.yaml
#
# La contrasena del panel de HAProxy se toma de un archivo .env
# que NO se versiona. Ver .env.example.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - monitor-net
    ports:
      # Aislado en localhost para que solo se consulte internamente
      - "127.0.0.1:9090:9090"

  haproxy-exporter:
    image: prom/haproxy-exporter:latest
    container_name: haproxy-exporter
    restart: unless-stopped
    command:
      - '--haproxy.scrape-uri=http://admin:${HAPROXY_STATS_PASS}@10.33.195.180:32500/;csv'
    networks:
      - monitor-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitor-net
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://10.33.195.180:3000/
      # Acceso cifrado: reutiliza el certificado de HAProxy
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/certs/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/certs/grafana.key
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/certs:/etc/grafana/certs:ro
    networks:
      - monitor-net
    ports:
      - "10.33.195.180:3000:3000"

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  monitor-net:
    driver: bridge
