# VM1 (proxy1): receptor central de logs de Nodo Sur
# Escucha solo en la IP interna; UFW limita el origen a 10.33.199.64/29
module(load="imtcp")
input(type="imtcp" port="5514" address="10.33.199.65")

# Un archivo por maquina y por dia
template(name="PorMaquina" type="string"
  string="/var/log/nodosur/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log")

# Solo lo que llega por red va al arbol central
if ($fromhost-ip != "127.0.0.1") then {
    action(type="omfile" dynaFile="PorMaquina" fileCreateMode="0640" dirCreateMode="0750")
    stop
}
